<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#FBF4E9"/>
  <g transform="translate(400, 420)">
    <!-- Cat Head & Body in Continuous Stroke -->
    <path d="M 0,-140
             C 40,-140 70,-135 100,-120
             L 170,-250 L 175,-90
             C 210,-40 230,20 220,90
             C 205,180 130,250 0,250
             C -130,250 -205,180 -220,90
             C -230,20 -210,-40 -175,-90
             L -170,-250 L -100,-120
             C -70,-135 -40,-140 0,-140 Z"
          fill="none" stroke="#234E8C" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Sitting Body & Paws Loop -->
    <path d="M -110,230 C -160,260 -180,310 -150,370 C -120,410 120,410 150,370 C 180,310 160,260 110,230"
          fill="none" stroke="#234E8C" stroke-width="30" stroke-linecap="round"/>
    <circle cx="-50" cy="380" r="24" fill="#234E8C"/>
    <circle cx="50" cy="380" r="24" fill="#234E8C"/>
    
    <!-- Facial Features -->
    <path d="M -110,20 C -90,-10 -65,-10 -45,20" fill="none" stroke="#234E8C" stroke-width="24" stroke-linecap="round"/>
    <path d="M 45,20 C 65,-10 95,-10 110,20" fill="none" stroke="#234E8C" stroke-width="24" stroke-linecap="round"/>
    <path d="M -45,105 C -22,135 0,130 0,100 C 0,130 22,135 45,105" fill="none" stroke="#234E8C" stroke-width="24" stroke-linecap="round"/>
    <polygon points="0,75 -10,88 10,88" fill="#F5623D"/>
    <line x1="-150" y1="85" x2="-215" y2="78" stroke="#234E8C" stroke-width="18" stroke-linecap="round"/>
    <line x1="-145" y1="118" x2="-205" y2="128" stroke="#234E8C" stroke-width="18" stroke-linecap="round"/>
    <line x1="150" y1="85" x2="215" y2="78" stroke="#234E8C" stroke-width="18" stroke-linecap="round"/>
    <line x1="145" y1="118" x2="205" y2="128" stroke="#234E8C" stroke-width="18" stroke-linecap="round"/>

    <!-- Elegant Tail sweeping around side into True North Arrow -->
    <path d="M 150,370 C 260,340 300,180 250,50 L 250,-180" fill="none" stroke="#F5623D" stroke-width="30" stroke-linecap="round"/>
    <polygon points="250,-225 220,-165 250,-180 280,-165" fill="#F5623D"/>

    <!-- Top needle on head -->
    <line x1="0" y1="-140" x2="0" y2="-260" stroke="#F5623D" stroke-width="30" stroke-linecap="round"/>
    <polygon points="0,-300 -32,-240 0,-255 32,-240" fill="#F5623D"/>
  </g>
</svg>